# The mjswan browser demo: build it, run the policy the way the browser does, load it in Chromium.
# All on CPU (scripts/mjswan/check.py, smoke.py). Ready PRs also get a non-blocking comment with
# 32-trial success rates of the PR and its base, the PR under pushes and slippery feet (16 each),
# and GIFs of the PR's scenes in the browser.
name: mjswan policy

on:
  push:
    branches: [main]
    paths: ["scripts/mjswan/**", ".github/workflows/mjswan*.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["scripts/mjswan/**", ".github/workflows/mjswan*.yml"]
  workflow_dispatch:

concurrency:
  group: mjswan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail, so `check.py | tee` fails when check.py does

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: scripts/mjswan/*.py
      # The file name does not encode the checkpoint's commit: exact key, never restore-keys.
      - uses: actions/cache@v6
        with:
          path: scripts/mjswan/.cache
          key: ame2-${{ hashFiles('scripts/mjswan/task.py') }}
      - run: uv run scripts/mjswan/build.py --no-launch
      - run: uv run scripts/mjswan/check.py --trials 4 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run --with playwright==1.55.0 playwright install --with-deps chromium
      - run: uv run scripts/mjswan/smoke.py --out screenshots
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # The repo's pre-commit hooks (black, flake8, isort, ...) on this workflow's files.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.9.26"
      - run: uvx pre-commit@4.0.1 run --show-diff-on-failure --files scripts/mjswan/*.py .github/workflows/mjswan*.yml

  pr-stats:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write  # the GIFs go to the ci-media branch
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # upstream publishes no major-version tag
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: scripts/mjswan/*.py
      - uses: actions/cache@v6
        with:
          path: scripts/mjswan/.cache
          key: ame2-${{ hashFiles('scripts/mjswan/task.py') }}
      - name: Evaluate the PR and its base
        run: |
          evaluate() {  # $1: repo root, then extra check.py args; prints the tables or why there are none
            if [ ! -f "$1/scripts/mjswan/check.py" ]; then echo "No \`check.py\` here yet."; return; fi
            uv run "$1/scripts/mjswan/build.py" --no-launch >&2 &&
              uv run "$1/scripts/mjswan/check.py" --trials 32 "${@:2}" || echo "Exit $?: under the 75 % gate, or a crash (see the workflow log)."
          }
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          {
            echo "<!-- mjswan-stats -->"  # this job edits only the comment carrying this marker
            echo "### mjswan policy: 32 jittered trials per scene, 16 per perturbation"
            echo
            echo "C MuJoCo on the built browser scenes, as the browser runs them. Not blocking."
            echo
            echo "**This PR** (${HEAD_SHA::7})"
            echo
            evaluate . --sweep --sweep-trials 16  # the base may predate --sweep; 32 each takes ~50 min
            echo
            echo "**Base** (${BASE_SHA::7})"
            echo
            evaluate "$RUNNER_TEMP/base"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      # GitHub has no API for comment attachments, so the GIFs live on the `ci-media` branch: one
      # parentless commit holding the latest GIFs of each PR, so its history never grows.
      # ponytail: two PRs finishing at once can drop each other's folder; the next run restores it.
      - name: Record the PR's scenes
        continue-on-error: true
        run: |
          uv run --with playwright==1.55.0 playwright install --with-deps chromium >&2
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >&2
          uv run scripts/mjswan/smoke.py --out "$RUNNER_TEMP/shots" --video "$RUNNER_TEMP/videos" >&2
          media="$RUNNER_TEMP/media"
          if git fetch -q --depth=1 origin ci-media; then
            git worktree add -q --detach "$media" FETCH_HEAD
          else
            git worktree add -q --orphan -b ci-media "$media"
          fi
          rm -rf "$media/pr-$PR" && mkdir -p "$media/pr-$PR"
          for v in "$RUNNER_TEMP"/videos/*.webm; do
            ffmpeg -v error -i "$v" -loop 0 \
              -vf "fps=6,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=bayer" \
              "$media/pr-$PR/$(basename "$v" .webm).gif"
          done
          git -C "$media" add -A
          sha=$(git -C "$media" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$(git -C "$media" write-tree)" -m "CI media: the latest GIFs of each PR")
          git push -q -f origin "$sha:refs/heads/ci-media"
          {
            echo
            echo "**This PR in the browser** (headless Chromium, ${HEAD_SHA::7})"
            echo
            echo "| Scene | |"
            echo "|---|---|"
            for g in "$media/pr-$PR"/*.gif; do
              n=$(basename "$g" .gif)
              echo "| $n | <img src=\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$sha/pr-$PR/$n.gif\" width=\"360\"> |"
            done
          } > media.md
          cat media.md >> comment.md
      # Not `gh pr comment --edit-last`: other workflows (claude review) post as the same bot.
      - run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- mjswan-stats -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
