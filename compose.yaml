services:
  rl:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    command: sleep infinity

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES}
      HISTFILE: ${HISTFILE}
      PROMPT_COMMAND: ${PROMPT_COMMAND}
      MAD_ASSETS_PATH: ${MAD_ASSETS_PATH}

    volumes:
      - .:/workspace
      - ../mad_assets/models:${MAD_ASSETS_PATH:-}/models
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    stdin_open: true
    tty: true
    ipc: host
    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
