[workspace]
authors = ["Andrii Osidach <andriiosidach@gmail.com>"]
channels = ["conda-forge"]
name = "mad_rl"
platforms = [{ platform = "linux-64", glibc = "2.35" }]
version = "0.1.0"

[dependencies]
python = "==3.12"
git = "*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
prerelease-mode = "allow"

# Verbatim from upstream's tools/wheel_builder/uv-overrides.txt at v3.0.0: the
# `--overrides` file the official `isaaclab[isaacsim]` wheel install passes to uv.
# Isaac Sim 6.2 pins conflict with Isaac Lab without them. Re-sync on every bump.
[pypi-options.dependency-overrides]
numpy = ">=2"
mujoco = "~=3.12.0"
mujoco-warp = "~=3.12.0"
newton = { version = "==1.6.1", extras = ["sim"] }
newton-usd-schemas = ">=0.5.0"
usd-exchange = "==3.0.1"
usd-optimize = "~=1.3.1"
torch = "==2.11.0"
torchvision = "==0.26.0"
fsspec = ">=2026.6.0"
packaging = ">=20,<27"
urllib3 = ">=2.8.0"

[pypi-dependencies]
isaaclab = { version = "==3.0.0", extras = ["isaacsim", "rsl-rl", "wandb"] }
mad_rl = { path = "source/mad_rl", editable = true }
pyarrow = "*"

[activation]
env = { 
    LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:$CONDA_PREFIX/lib:/usr/lib/x86_64-linux-gnu", 
    PYTHONNOUSERSITE = "1", 
    OMNI_KIT_ACCEPT_EULA = "YES", 
    MAD_ASSETS_PATH = "$PIXI_PROJECT_ROOT/../mad_assets" 
}
scripts = ["scripts/env_setup.sh"]

[tasks]
list_envs = "python scripts/list_envs.py"
zero_agent = "isaaclab zero_agent"
random_agent = "isaaclab random_agent"
# In 3.0 `--export_io_descriptors` is False by default.
train = "isaaclab train --export_io_descriptors"
play = "isaaclab play"
tensorboard = "tensorboard --logdir logs"
